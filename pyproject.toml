[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prelnc"
version = "2.0.0"
description = "Predict long non-coding RNAs from transcript FASTA for plant and animal species"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [{ name = "Lei Cao" }]
keywords = ["lncRNA", "bioinformatics", "transcriptome", "coding-potential"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Upper bounds are deliberate: the bundled .pkl models were trained with an old
# scikit-learn and are unpickled by prelnc.model_ops. numpy>=2 breaks loading of
# those pickles, and scikit-learn>=1.4 changed estimator layouts again.
dependencies = [
    "biopython>=1.79",
    "numpy>=1.16,<2",
    "scikit-learn>=0.22,<1.4",
]

[project.urls]
Homepage = "https://github.com/LeiCao97/PreLnc"

[project.scripts]
prelnc = "prelnc.cli:main"
prelnc-train = "prelnc.cli:train_main"
prelnc-hexamer = "prelnc.cli:hexamer_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["prelnc*"]

[tool.setuptools.package-data]
prelnc = ["data/models/*.pkl", "data/models/*.tsv"]
